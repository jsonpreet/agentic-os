name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Bundle
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts & engine
        run: |
          pnpm --filter @agentic/shared-contracts build
          pnpm --filter @agentic/local-engine build
          pnpm --filter @agentic/app-sdk build

      - name: Build desktop release (.dmg & .app)
        run: pnpm --filter @agentic/desktop tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-bundle
          path: |
            packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/release/bundle/macos/*.app

  build-viewer:
    name: Build Windows/Web Viewer Archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts & viewer
        run: |
          pnpm --filter @agentic/shared-contracts build
          bash scripts/release-windows-viewer.sh

      - name: Upload Viewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-viewer-bundle
          path: packages/desktop/dist-viewer.zip

  publish-release:
    name: Create GitHub Release
    needs: [build-macos, build-viewer]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release-bundle
          path: release-artifacts/macos

      - name: Download Viewer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-viewer-bundle
          path: release-artifacts/viewer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/macos/*.dmg
            release-artifacts/viewer/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
